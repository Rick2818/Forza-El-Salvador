<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17191d" />
  <title>Porsche 911 — inspección 3D · Horizon El Salvador</title>
  <style>
    * { box-sizing:border-box }
    html,body { margin:0; height:100%; overflow:hidden; background:#16191d; color:#f0f0f2; font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .header { position:absolute; z-index:2; top:16px; left:16px; max-width:440px; padding:15px 20px; border:1px solid #ffffff24; background:#12141ae9; border-radius:13px; backdrop-filter:blur(10px); pointer-events:none; }
    h1 { font-weight:650; font-size:clamp(18px,2.3vw,27px); margin:0 0 5px }
    p { color:#aeb1b8; font-size:13px; line-height:1.5; margin:6px 0 }
    .tag { font-size:10px; font-weight:700; letter-spacing:.13em; color:#f7cb43 }
    .footer { position:absolute; z-index:2; left:16px; bottom:16px; padding:11px 15px; border-radius:10px; background:#12141ae9; border:1px solid #ffffff20; font-size:12px; color:#d0d3d8 }
    #fps { color:#e5d085; font-variant-numeric:tabular-nums }
    a { color:#c0d4ff; pointer-events:auto }
    @media(max-width:550px){.header{left:8px;right:8px;top:8px;padding:10px 13px}.footer{left:8px;right:8px;bottom:8px}}
  </style>
</head>
<body>
  <div class="header">
    <div class="tag">HORIZON EL SALVADOR · PREPRODUCCIÓN</div>
    <h1>Porsche 911 · Grafito</h1>
    <p>Modelo 3D de inspección: gira con el dedo o mouse; pellizca o usa la rueda para acercarte. No es una fotografía ni una reproducción CAD oficial.</p>
  </div>
  <canvas id="preview-canvas" aria-label="Vista 3D interactiva del Porsche 911"></canvas>
  <div class="footer">Vista 3D real · <span id="fps">-- FPS</span> · <span id="geometry">Analizando geometría…</span></div>
  <script type="module" src="/src/porschePreview.ts"></script>
</body>
</html>
