name: Revisar Monzon sin publicar
on:
  push:
    branches: [review/monzon-night-quality]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Horizon-REA-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test && npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run preview > /tmp/monzon-vite.log 2>&1 &
      - run: node tools/review-monzon.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monzon-review
          path: Horizon-REA-2026/review/monzon
