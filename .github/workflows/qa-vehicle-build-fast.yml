name: Compilación rápida · Garaje 10 vehículos
on:
  push:
    branches: ["feat/ten-real-glb-gallery-20261123"]
    paths:
      - ".github/workflows/qa-vehicle-build-fast.yml"
      - "Horizon-REA-2026/vite.config.ts"
      - "Horizon-REA-2026/package.json"
      - "Horizon-REA-2026/tools/prepare-draco.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Horizon-REA-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Horizon-REA-2026/package-lock.json
      - run: npm ci
      - name: Compilar TypeScript y ambas páginas
        run: npm run build
      - name: Confirmar diez GLB en distribución
        run: |
          test -s dist/index.html
          test -s dist/model-gallery.html
          test -s dist/model-draco/draco_decoder.wasm
          test "$(find dist/models/external-candidates/ -maxdepth 1 -name '*.glb' | wc -l)" -eq 10
