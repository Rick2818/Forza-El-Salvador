name: Revisar garajes de Monzon sin publicar
on:
  push:
    branches: [review/monzon-open-garages, feature/trackside-partners-monzon-suzaka]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Horizon-REA-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test && npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run preview > /tmp/monzon-garages-vite.log 2>&1 &
      - run: node tools/review-garages.mjs
        env:
          SKIP_RACE_BENCHMARK: '1'
      - run: node tools/review-quality.mjs
      - run: node tools/review-partners.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monzon-garages-review
          path: |
            Horizon-REA-2026/review/garages
            Horizon-REA-2026/review/quality
            Horizon-REA-2026/review/partners
