name: Ferrari FBX vs GLB experiment (no deployment)
on:
  push:
    branches: [experiment/ferrari-fbx-ab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.ref == 'refs/heads/experiment/ferrari-fbx-ab'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        circuit: [monzon, suzaka]
        format: [glb, fbx]
    defaults:
      run:
        working-directory: Horizon-REA-2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Horizon-REA-2026/package-lock.json
      - name: Convert the licensed Ferrari GLB to FBX using verified Blender
        if: matrix.format == 'fbx'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/blender-fbx"
          mkdir -p "$work" review/quality
          base=https://download.blender.org/release/Blender5.0
          archive=blender-5.0.1-linux-x64.tar.xz
          curl -fsSL --retry 3 "$base/$archive" -o "$work/$archive"
          curl -fsSL --retry 3 "$base/blender-5.0.1.sha256" -o "$work/blender.sha256"
          (cd "$work"; grep -E "[[:space:]]\\*?$archive$" blender.sha256 > archive.sha256; sha256sum --check archive.sha256; tar -xf "$archive")
          "$work/blender-5.0.1-linux-x64/blender" -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/blender/ferrari-fbx-experiment.py
          cp public/models/external-candidates/ferrari-f430-LICENSE.txt public/models/experimental/
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Run matched real Three.js race continuity test
        env:
          FERRARI_FORMAT: ${{ matrix.format }}
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          set -euo pipefail
          mkdir -p review/quality
          npm run dev > review/quality/ferrari-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/race.html > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/race.html > /dev/null
          node tools/pickup-v24-continuity.mjs ferrari-f430 baseline "$CIRCUIT" 2>&1 | tee review/quality/ferrari-continuity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferrari-ab-${{ matrix.circuit }}-${{ matrix.format }}
          path: |
            Horizon-REA-2026/review/quality/
            Horizon-REA-2026/public/models/experimental/
          if-no-files-found: warn
