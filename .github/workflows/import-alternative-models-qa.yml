name: Importar 4 sustitutos GLB (solo QA)
on:
  push:
    branches: ["qa/real-vehicle-previews-20261123"]
    paths: [".github/workflows/import-alternative-models-qa.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-alternatives:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Descargar GLB de biblioteca pública con atribuciones
        run: node tools/import-vehicle-alternatives.mjs
      - name: Guardar diez candidatos en rama QA, no producción
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Horizon-REA-2026/public/models/external-candidates/
          if ! git diff --cached --quiet; then
            git commit -m "assets: agregar 4 sustitutos reales con licencias para revisión QA"
            git push origin HEAD:qa/real-vehicle-previews-20261123
          fi
