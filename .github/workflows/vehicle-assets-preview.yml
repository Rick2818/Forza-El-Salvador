name: Previsualizar Ferrari con licencia documentada (no publicar)
on:
  push:
    branches: [art/ten-realistic-vehicles-intake-20261123]
    paths:
      - "Horizon-REA-2026/replacements/**"
      - "Horizon-REA-2026/tools/audit-replacement-models.mjs"
      - ".github/workflows/vehicle-assets-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-ferrari-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y comparar seis candidatos Ferrari GLB bajo atribución CC BY
        run: |
          mkdir -p Horizon-REA-2026/replacements/assets Horizon-REA-2026/replacements/reports
          BASE="https://raw.githubusercontent.com/supercar3d/supercar_3D_asssets/main/basic/ferrari"
          for entry in "f488/f488.glb" "f40/f40.glb" "f430/f430.glb" "roma-2020/roma-2020.glb" "sf90/sf90.glb" "cilindri/cilindri.glb"; do
            name="${entry#*/}"
            name="${name%.glb}"
            echo "AUDITANDO Ferrari: ${entry}"
            curl --fail --silent --show-error --location --retry 3 --max-time 90 \
              "${BASE}/${entry}" -o "Horizon-REA-2026/replacements/assets/${name}.glb"
            ( cd Horizon-REA-2026 &&
              node tools/audit-replacement-models.mjs --file "replacements/assets/${name}.glb" \
                | tee -a replacements/reports/ferrari-candidate-mesh-audit.jsonl )
          done
          cp Horizon-REA-2026/replacements/assets/f488.glb \
            Horizon-REA-2026/replacements/assets/ferrari-488-pista-spider.glb
      - name: Diagnóstico del lote completo (sin sustituir autos existentes)
        working-directory: Horizon-REA-2026
        run: node tools/audit-replacement-models.mjs --available
      - name: Guardar modelos para revisión técnica y reporte estructural
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-candidates-preproduccion
          path: |
            Horizon-REA-2026/replacements/assets/*.glb
            Horizon-REA-2026/replacements/reports/*.jsonl
          retention-days: 7
