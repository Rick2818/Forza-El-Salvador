name: Importar otros 4 GLB existentes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-extra-existing-vehicles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/import-extra-existing-vehicles.mjs
      - name: Guardar GLB reales sin activar vehículos no probados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Horizon-REA-2026/public/models/external-candidates/
          if ! git diff --cached --quiet; then
            git commit -m "assets: importar Porsche Bugatti Koenigsegg Ford Raptor"
            git push origin HEAD:main
          fi
