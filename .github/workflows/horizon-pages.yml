name: Publicar Horizon El Salvador en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Horizon-REA-2026/**'
      - '.github/workflows/horizon-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: horizon-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Horizon-REA-2026/package-lock.json

      - name: Instalar dependencias
        working-directory: Horizon-REA-2026
        run: npm ci

      - name: Probar los vehículos y las carreras
        working-directory: Horizon-REA-2026
        run: npm test

      - name: Compilar Horizon
        working-directory: Horizon-REA-2026
        run: npm run build

      - name: Verificar cuatro circuitos Blender y archivos GLB incluidos
        working-directory: Horizon-REA-2026
        run: node tools/verify-circuit-assets.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir juego compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: Horizon-REA-2026/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
