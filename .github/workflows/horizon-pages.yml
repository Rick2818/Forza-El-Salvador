name: Publicar Horizon El Salvador en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Horizon-REA-2026/**'
      - '.github/workflows/horizon-pages.yml'
  workflow_run:
    workflows: ["Construir arboles Monzon - Blender 3 pasadas"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: horizon-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Horizon-REA-2026/package-lock.json

      - name: Instalar dependencias
        working-directory: Horizon-REA-2026
        run: npm ci

      - name: Probar los siete vehículos y las carreras (obligatorio)
        working-directory: Horizon-REA-2026
        run: npm test

      - name: Auditar sólidos y materiales 3D de los siete autos
        working-directory: Horizon-REA-2026
        run: node tools/audit-car-glbs.mjs

      - name: Compilar Horizon
        working-directory: Horizon-REA-2026
        run: npm run build

      - name: Verificar cuatro circuitos Blender y archivos GLB incluidos
        working-directory: Horizon-REA-2026
        run: node tools/verify-circuit-assets.mjs

      - name: Verificar Silverado y pickups reales antes de publicar
        working-directory: Horizon-REA-2026
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          npm run dev > /tmp/horizon-release-probe.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/race.html > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/race.html > /dev/null
          node tools/pickup-v24-probe.mjs
          node tools/offroad-render-probe.mjs

      - name: Bloquear candidato V30 sin aprobación de calidad
        working-directory: Horizon-REA-2026
        run: node tools/v30-release-gate.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir juego compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: Horizon-REA-2026/dist

      # GitHub's Actions artifact metadata is sometimes unavailable immediately
      # after upload; allow it to propagate before Pages looks up github-pages.
      - name: Confirmar propagación del artefacto antes de publicar
        run: sleep 15

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
