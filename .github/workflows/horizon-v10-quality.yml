name: V10 calidad, siete autos y carreras completas
on:
  push:
    branches: [quality/v10-race-stability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Horizon-REA-2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Horizon-REA-2026/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node tools/audit-car-glbs.mjs && npm run build && node tools/verify-circuit-assets.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run preview > /tmp/horizon-v10-preview.log 2>&1 &
      - run: node tools/review-v10.mjs
      - run: node tools/review-partners.mjs && node tools/review-engine-audio.mjs
      - name: Compilar referencia V9 sin modificar su fuente
        run: |
          git worktree add --detach /tmp/horizon-v9 bfe6f0bec835fc9d9e6ced62ca43f7e51e712499
          ln -s "$GITHUB_WORKSPACE/Horizon-REA-2026/node_modules" /tmp/horizon-v9/Horizon-REA-2026/node_modules
          cd /tmp/horizon-v9/Horizon-REA-2026
          npm run build
          npm run preview -- --port 4174 > /tmp/horizon-v9-preview.log 2>&1 &
      - name: Capturar referencia V9 con las mismas condiciones
        run: REVIEW_LABEL=baseline REVIEW_URL=http://127.0.0.1:4174/ node tools/review-v10.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizon-v10-quality-evidence
          path: |
            Horizon-REA-2026/review
          if-no-files-found: error
