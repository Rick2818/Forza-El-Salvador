name: Acquire approved public truck audio (review only)
on:
  push:
    branches: [experiment/webgpu-silverado-offroad]
    paths: [.github/workflows/silverado-audio-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install audio validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version
          ffmpeg -version
      - name: Discover public preview, never authenticated original
        run: |
          set -euo pipefail
          mkdir -p review/audio
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, html, pathlib, hashlib, json
          source='https://freesound.org/people/joni_ompong/sounds/785698/'
          pages=[source,'https://freesound.org/embed/sound/iframe/785698/?size=medium']
          candidates=set()
          for page in pages:
              try:
                  req=urllib.request.Request(page,headers={'User-Agent':'HorizonAudioReview/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=html.unescape(r.read(3000000).decode('utf-8','replace')).replace('\\/','/')
                  for url in re.findall(r'(?:https:)?//[^\s"\x27<>]+?\.mp3',body):
                      url=urllib.parse.urljoin(page,url)
                      p=urllib.parse.urlparse(url)
                      if p.scheme=='https' and p.hostname in ('cdn.freesound.org','freesound.org') and '/previews/' in p.path and re.search(r'/785698_[^/]+\.mp3$',p.path):
                          candidates.add(url)
              except Exception as e: print('Public page unavailable:',type(e).__name__,str(e)[:200])
          if not candidates:
              raise SystemExit('No explicitly published preview found. Obtain original from author or logged-in Freesound download; no guessed URLs.')
          ordered=sorted(candidates,key=lambda u: ('-hq.mp3' not in u,u))
          url=ordered[0]
          req=urllib.request.Request(url,headers={'User-Agent':'HorizonAudioReview/1.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              if urllib.parse.urlparse(r.geturl()).hostname not in ('cdn.freesound.org','freesound.org'):
                  raise SystemExit('Unexpected preview redirect')
              data=r.read(2000001)
          if not 10000<len(data)<=2000000: raise SystemExit('Unexpected audio size')
          if not (data[:3]==b'ID3' or (data[0]==255 and data[1]&224==224)): raise SystemExit('Not MP3')
          pathlib.Path('review/audio/truck-driving-785698.mp3').write_bytes(data)
          pathlib.Path('review/audio/source.json').write_text(json.dumps({'sound_id':785698,'author':'joni_ompong','license':'CC0-1.0','source':source,'preview':url,'sha256':hashlib.sha256(data).hexdigest(),'note':'Public preview; generic truck, not verified Chevrolet EV.'},indent=2))
          print('Preview acquired:',len(data),'bytes')
          PY
          ffprobe -v error -show_entries format=duration:stream=codec_name,sample_rate,channels -of json review/audio/truck-driving-785698.mp3 | tee review/audio/probe.json
          python3 - <<'PY'
          import json
          p=json.load(open('review/audio/probe.json'))
          assert 5.9<float(p['format']['duration'])<6.5
          assert any(s.get('codec_name')=='mp3' for s in p['streams'])
          PY
          ffmpeg -v error -i review/audio/truck-driving-785698.mp3 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: approved-truck-audio-785698
          path: review/audio/

  incorporate:
    needs: acquire
    if: github.ref == 'refs/heads/experiment/webgpu-silverado-offroad'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/webgpu-silverado-offroad
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: approved-truck-audio-785698
          path: review/audio
      - name: Incorporate verified recording in experimental branch only
        id: commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, hashlib, pathlib, shutil
          src=pathlib.Path('review/audio')
          data=(src/'truck-driving-785698.mp3').read_bytes()
          meta=json.loads((src/'source.json').read_text())
          assert meta['sound_id']==785698 and meta['license']=='CC0-1.0'
          assert hashlib.sha256(data).hexdigest()==meta['sha256']
          dest=pathlib.Path('Horizon-REA-2026/public/audio')
          dest.mkdir(parents=True,exist_ok=True)
          for filename in ('truck-driving-785698.mp3','source.json'):
              shutil.copyfile(src/filename,dest/('truck-driving-785698.source.json' if filename=='source.json' else filename))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Horizon-REA-2026/public/audio/truck-driving-785698.mp3 Horizon-REA-2026/public/audio/truck-driving-785698.source.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(audio): incorporate validated CC0 truck recording 785698"
            git push origin HEAD:refs/heads/experiment/webgpu-silverado-offroad
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate_game:
    needs: incorporate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Horizon-REA-2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.incorporate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Horizon-REA-2026/package-lock.json
      - run: npm ci
      - run: npm exec -- vitest run src/world/offroadTrack.test.ts src/world/offroadPrototype.test.ts src/render/pickupMud.test.ts src/world/trailStage.test.ts
      - run: npm run build
      - run: |
          set -euo pipefail
          test -s dist/audio/truck-driving-785698.mp3
          cmp public/audio/truck-driving-785698.mp3 dist/audio/truck-driving-785698.mp3
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Drive full existing offroad audit with mandatory recorded audio
        run: |
          set -euo pipefail
          mkdir -p review/quality
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/webgpu-fleet-probe.mjs')
          s=p.read_text()
          a='const m=await page.evaluate(()=>window.HORIZON_GPU_DRIVE);'
          assert s.count(a)==1
          s=s.replace(a,'await page.waitForFunction(()=>window.HORIZON_GPU_DRIVE.audioRecordingState==="recorded",{},{timeout:20000});'+a+'assert.equal(m.audioRecordingState,"recorded");console.log("RECORDED_AUDIO",m.audioRecordingState,m.maxAudioRms);')
          p.write_text(s)
          PY
          npm run dev > review/quality/fleet-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/webgpu-fleet.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/webgpu-fleet.html >/dev/null
          xvfb-run -a node tools/webgpu-fleet-probe.mjs el-imposible-4x4 chevrolet-silverado-ev-alternative 2>&1 | tee review/quality/fleet-console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silverado-recorded-audio-drive
          path: Horizon-REA-2026/review/quality/
