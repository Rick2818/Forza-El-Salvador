name: WebGPU individual fleet audit (no deployment)
on:
  push:
    branches: [experiment/webgpu-fleet]
permissions:
  contents: read
jobs:
  vehicle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - vehicle: ferrari-f430
            circuit: monzon
          - vehicle: ferrari-f430
            circuit: suzaka
          - vehicle: porsche-911-c4s
            circuit: monzon
          - vehicle: porsche-911-c4s
            circuit: suzaka
          - vehicle: bugatti-chiron-profilee
            circuit: monzon
          - vehicle: bugatti-chiron-profilee
            circuit: suzaka
          - vehicle: lamborghini-aventador
            circuit: monzon
          - vehicle: lamborghini-aventador
            circuit: suzaka
          - vehicle: koenigsegg-jesko
            circuit: monzon
          - vehicle: koenigsegg-jesko
            circuit: suzaka
          - vehicle: mercedes-amg-gt-alternative
            circuit: monzon
          - vehicle: mercedes-amg-gt-alternative
            circuit: suzaka
          - vehicle: tesla-roadster-electric-alternative
            circuit: monzon
          - vehicle: tesla-roadster-electric-alternative
            circuit: suzaka
          - vehicle: ford-f150-raptor-police
            circuit: monzon
          - vehicle: ford-f150-raptor-police
            circuit: suzaka
          - vehicle: ford-f150-raptor-police
            circuit: el-imposible-4x4
          - vehicle: ram-3500-alternative
            circuit: monzon
          - vehicle: ram-3500-alternative
            circuit: suzaka
          - vehicle: ram-3500-alternative
            circuit: el-imposible-4x4
          - vehicle: chevrolet-silverado-ev-alternative
            circuit: monzon
          - vehicle: chevrolet-silverado-ev-alternative
            circuit: suzaka
          - vehicle: chevrolet-silverado-ev-alternative
            circuit: el-imposible-4x4
    defaults:
      run:
        working-directory: Horizon-REA-2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Horizon-REA-2026/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Run individual audit, 125 simulated seconds
        env:
          CIRCUIT: ${{ matrix.circuit }}
          VEHICLE: ${{ matrix.vehicle }}
        run: |
          set -euo pipefail
          mkdir -p review/quality
          npm run dev > review/quality/fleet-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/webgpu-fleet.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/webgpu-fleet.html >/dev/null
          xvfb-run -a node tools/webgpu-fleet-probe.mjs "$CIRCUIT" "$VEHICLE" 2>&1 | tee review/quality/fleet-console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-${{ matrix.vehicle }}-${{ matrix.circuit }}
          path: Horizon-REA-2026/review/quality/
