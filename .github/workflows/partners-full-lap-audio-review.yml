name: Validar anuncios en toda la vuelta y motores potentes
on:
  push:
    branches: [fix/full-lap-partners-louder-engines]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lap-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: Horizon-REA-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Horizon-REA-2026/package-lock.json
      - run: npm ci
      - run: npm test && npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run preview > /tmp/forza-lap-audio.log 2>&1 &
      - run: node tools/review-partners.mjs
      - run: node tools/review-engine-audio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anuncios-toda-vuelta-sonido-v10
          path: |
            Horizon-REA-2026/review/partners
            Horizon-REA-2026/review/audio
