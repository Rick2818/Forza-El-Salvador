name: V20 - Auditar suelo y escala Mercedes GLB
on:
  push:
    branches: [fix/v20-model-integrity-20261123]
    paths: ['.github/workflows/v20-mercedes-geometry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar metadatos originales GLB
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'Horizon-REA-2026/public/models/external-candidates/mercedes-amg-gt-alternative.glb';
          const data = fs.readFileSync(path);
          if(data.toString('ascii',0,4)!=='glTF')throw new Error('No es GLB');
          const json = JSON.parse(data.subarray(20,20+data.readUInt32LE(12)).toString('utf8'));
          console.log('GLB nodes',json.nodes?.length,'meshes',json.meshes?.length);
          for(const [i,n] of (json.nodes||[]).entries())
            console.log('NODE',i,JSON.stringify({name:n.name,mesh:n.mesh,scale:n.scale,rotation:n.rotation,translation:n.translation}));
          for(const [i,m] of (json.meshes||[]).entries())
            console.log('MESH',i,JSON.stringify({name:m.name,primitives:m.primitives?.length}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v20-mercedes-source-glb-inspect
          path: Horizon-REA-2026/public/models/external-candidates/mercedes-amg-gt-alternative.glb
          retention-days: 2
