name: Construir arboles Monzon - Blender 3 pasadas

on:
  push:
    branches:
      - main
    paths:
      - Horizon-REA-2026/tools/blender/build_monzon_three_pass.py
      - .github/workflows/monzon-blender-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monzon-blender-assets
  cancel-in-progress: true

jobs:
  blender-trees:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar rama de trabajo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender -b --factory-startup --python-expr "import bpy, numpy; print('Blender',bpy.app.version_string,'NumPy',numpy.__version__)"
      - name: Tres pasadas reales y exportacion GLB
        working-directory: Horizon-REA-2026
        run: |
          blender -b -t 2 --factory-startup --python tools/blender/build_monzon_three_pass.py
          test -s public/scenery/monzon-tree-v1.glb
          test -s public/scenery/monzon-tree-v2.glb
      - name: Guardar evidencia Blender de las tres pasadas
        uses: actions/upload-artifact@v4
        with:
          name: monzon-tree-blender-three-passes
          path: Horizon-REA-2026/review/monzon-blender/pass-*.blend
          retention-days: 14
      - name: Guardar modelos GLB en main para que GitHub Pages los publique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Horizon-REA-2026/public/scenery/monzon-tree-v1.glb Horizon-REA-2026/public/scenery/monzon-tree-v2.glb
          if ! git diff --cached --quiet; then
            git commit -m "art: bake Monzon trees with three Blender passes [skip ci]"
            git push
          fi
